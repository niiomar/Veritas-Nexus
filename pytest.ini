[pytest]
asyncio_mode = auto
# The async SQLAlchemy engine (infrastructure/persistence/database.py) is a
# module-level singleton bound to whichever event loop first touches it.
# Function-scoped loops (pytest-asyncio's default) tear that loop down after
# every test, corrupting the connection pool on the next test with
# "cannot perform operation: another operation is in progress". Session
# scope keeps one loop alive for the whole run, matching the engine's actual
# lifetime.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
